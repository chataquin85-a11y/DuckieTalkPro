<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DuckieDuck Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DuckieTalkPro">
<link rel="apple-touch-icon" href="IMG_1101.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background-color: #0b2e13; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* Header */
header { background: #07220e; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #14451f; z-index: 10; }
.header-left { display: flex; align-items: center; gap: 10px; }
.menu-btn { background: none; border: none; color: #ffffff; font-size: 1.4em; cursor: pointer; }
.header-logo { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
.header-title { font-size: 1.05em; font-weight: bold; color: #ffffff; }
.header-actions { display: flex; gap: 12px; align-items: center; }
.header-actions button { background: none; border: none; color: #ffffff; font-size: 1.2em; cursor: pointer; }

/* Store / Partner Banner */
.store-banner { background: #14451f; padding: 5px 15px; font-size: 0.75em; color: #ffeb3b; text-align: center; border-bottom: 1px solid #1f5e2b; }

/* Action Buttons Bar */
.action-bar { background: #0b2e13; padding: 8px; display: flex; gap: 10px; justify-content: center; border-bottom: 1px solid #14451f; }
.action-bar button { border: none; padding: 7px 14px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.85em; display: flex; align-items: center; gap: 5px; color: white; }
.btn-voice { background: #28a745; }
.btn-video { background: #007bff; }

/* Chat Container */
.chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #0b2e13; position: relative; }
.message { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 0.95em; line-height: 1.4; word-wrap: break-word; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
.incoming { background-color: #14451f; align-self: flex-start; border-top-left-radius: 0; }
.outgoing { background-color: #1b5e20; align-self: flex-end; border-top-right-radius: 0; }
.error-msg { background-color: #a72828 !important; color: #ffffff; }

/* Input Controls Area */
.input-area { background: #07220e; padding: 10px 15px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #14451f; }
.input-tools { display: flex; gap: 15px; color: #858585; font-size: 1.1em; padding-left: 5px; cursor: pointer; }
.input-tools span:hover { color: #ffffff; }
.input-row { display: flex; align-items: center; gap: 8px; }
.input-row input { flex: 1; background: #14451f; border: 1px solid #1f5e2b; border-radius: 20px; padding: 10px 15px; color: #fff; font-size: 0.95em; outline: none; }
.input-row input::placeholder { color: #858585; }
.send-btn { background: #2e7d32; border: none; color: white; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; font-size: 1em; }
.send-btn:active { background: #1b5e20; }

/* Pestaña Flotante */
.floating-tab { position: absolute; top: 15px; right: 15px; background: rgba(20, 35, 25, 0.95); border: 1px solid #28a745; border-radius: 12px; padding: 15px; width: 240px; box-shadow: 0 5px 15px rgba(0,0,0,0.4); z-index: 20; display: none; }
.floating-tab h4 { font-size: 0.9em; text-align: center; margin-bottom: 10px; color: #fff; }
.floating-tab button { width: 100%; margin-bottom: 8px; padding: 8px; border-radius: 6px; border: none; font-weight: bold; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.85em; }
</style>
</head>
<body>

<header>
<div class="header-left">
<button class="menu-btn" onclick="openDuckieMenu()">☰</button>
<img src="IMG_1101.png" alt="Logo" class="header-logo">
<div class="header-title">DuckieTalkPro ^+^ /</div>
</div>
<div class="header-actions">
<button title="Configuración y ajustes" onclick="openSettings()">></button>
</div>
</header>

<div class="store-banner" onclick="openDuckieMenu()" style="cursor: pointer;">
🦆 DuckieTalkPro - VoIP y Servidor Starter Activo
</div>

<div class="action-bar">
<button class="btn-voice" onclick="startVoiceCall()">📞 Llamada de Voz</button>
<button class="btn-video" onclick="startVideocall()">📹 Videollamada</button>
</div>

<div class="chat-container" id="chatLog">
    <!-- Pestaña Flotante -->
    <div class="floating-tab" id="floatingTab">
        <h4>Pestaña Flotante</h4>
        <button class="btn-video" onclick="startVideocall()">📹 Videollamada</button>
        <button class="btn-voice" onclick="startVoiceCall()">📞 Llamada de Voz</button>
    </div>

<div class="message incoming">
DuckieTalk IA: ¡Bienvenido a tu canal verificado Amado! Sistema VoIP y servidor Starter activo. 🦆✨
</div>
</div>

<div class="input-area">
<div class="input-tools">
<span onclick="insertEmoji('😊')">😊</span>
<span onclick="triggerMedia()">🎬</span>
<span onclick="triggerCamera()">📷</span>
<span onclick="startVoiceCall()">🎤</span>
<span onclick="openDuckieMenu()">＋</span>
</div>
<div class="input-row">
<input type="text" id="userInput" placeholder="Escribe texto (Mensaje)...">
<button class="send-btn" id="sendBtn">➤</button>
</div>
</div>

<!-- Modal General -->
<div id="duckieActionModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; justify-content:center; align-items:center; flex-direction:column; font-family:sans-serif; color:white;">
<div style="background:#111; padding:25px; border-radius:20px; text-align:center; width:340px; box-shadow:0 10px 25px rgba(0,0,0,0.5); border: 2px solid #28a745;">
<h3 id="actionModalTitle" style="margin-bottom:15px; color:#28a745;">DuckieTalk Pro</h3>
<div id="actionModalBody" style="font-size:14px; color:#bbb; margin-bottom:20px; max-height:200px; overflow-y:auto; text-align:left;"></div>
<button onclick="closeActionModal()" style="background:#dc3545; border:none; color:white; padding:10px 20px; border-radius:20px; cursor:pointer; font-weight:bold; width:100%;">Cerrar</button>
</div>
</div>

<!-- Modal Llamadas -->
<div id="duckieCallModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; justify-content:center; align-items:center; flex-direction:column; font-family:sans-serif; color:white;">
<div style="background:#111; padding:30px; border-radius:20px; text-align:center; width:320px; box-shadow:0 10px 25px rgba(0,0,0,0.5); border: 2px solid #28a745;">
<h3 id="callTitle" style="margin-bottom:10px; color:#28a745;">DuckieCall VoIP</h3>
<p id="callStatus" style="font-size:14px; color:#bbb; margin-bottom:20px;">Conectando...</p>
<video id="callVideo" autoplay playsinline style="width:100%; height:180px; background:#000; border-radius:10px; display:none; object-fit:cover; margin-bottom:15px;"></video>
<div id="callTimer" style="font-size:18px; font-weight:bold; margin-bottom:25px;">00:00</div>
<div style="display:flex; justify-content:space-around; width:100%;">
<button onclick="toggleMute()" id="muteBtn" style="background:#444; border:none; color:white; padding:12px; border-radius:50%; cursor:pointer; font-size:16px;">🎤</button>
<button onclick="endCall()" style="background:#dc3545; border:none; color:white; padding:12px 25px; border-radius:30px; cursor:pointer; font-weight:bold;">Colgar</button>
</div>
</div>
</div>

<script>
const chatLog = document.getElementById('chatLog');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

async function handleSendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    const userDiv = document.createElement('div');
    userDiv.className = 'message outgoing';
    userDiv.textContent = 'Tú: ' + text;
    chatLog.appendChild(userDiv);
    userInput.value = '';
    chatLog.scrollTop = chatLog.scrollHeight;

    const loadingId = 'loading-' + Date.now();
    const waitingDiv = document.createElement('div');
    waitingDiv.className = 'message incoming';
    waitingDiv.id = loadingId;
    waitingDiv.textContent = 'DuckieTalk IA está procesando... 🦆';
    chatLog.appendChild(waitingDiv);
    chatLog.scrollTop = chatLog.scrollHeight;

    try {
        const response = await fetch('https://duckietalkpro.onrender.com/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
        });
        const data = await response.json();
        document.getElementById(loadingId).remove();

        const replyDiv = document.createElement('div');
        replyDiv.className = 'message incoming';
        replyDiv.textContent = 'DuckieTalk IA: ' + (data.reply || '¡Quack! Recibí tu mensaje.');
        chatLog.appendChild(replyDiv);
    } catch (error) {
        const loader = document.getElementById(loadingId);
        if (loader) loader.remove();

        const errorDiv = document.createElement('div');
        errorDiv.className = 'message incoming error-msg';
        errorDiv.textContent = 'DuckieTalk IA: Nota de red: Verificando conexión con el servidor Starter ($7). Por favor reintenta en un momento.';
        chatLog.appendChild(errorDiv);
    }
    chatLog.scrollTop = chatLog.scrollHeight;
}

sendBtn.addEventListener('click', handleSendMessage);
userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSendMessage(); });

function insertEmoji(emoji) { userInput.value += emoji; }
function triggerMedia() { alert("🎬 Seleccionar archivo multimedia..."); }
function triggerCamera() { alert("📷 Abriendo cámara segura..."); }

let callTimerInterval, callSeconds = 0, localStream = null, isMuted = false;

function startVoiceCall() {
    document.getElementById('callVideo').style.display = 'none';
    document.getElementById('callTitle').innerText = "DuckieCall - Voz";
    document.getElementById('duckieCallModal').style.display = 'flex';
    startCallTimer();
}

async function startVideocall() {
    document.getElementById('callTitle').innerText = "DuckieCall - Video";
    const videoEl = document.getElementById('callVideo');
    videoEl.style.display = 'block';
    document.getElementById('duckieCallModal').style.display = 'flex';
    try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        videoEl.srcObject = localStream;
    } catch (e) { console.error(e); }
    startCallTimer();
}

function startCallTimer() {
    callSeconds = 0;
    document.getElementById('callStatus').innerText = "En llamada...";
    callTimerInterval = setInterval(() => {
        callSeconds++;
        let mins = Math.floor(callSeconds / 60).toString().padStart(2, '0');
        let secs = (callSeconds % 60).toString().padStart(2, '0');
        document.getElementById('callTimer').innerText = `${mins}:${secs}`;
    }, 1000);
}

function toggleMute() {
    isMuted = !isMuted;
    if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
    document.getElementById('muteBtn').style.background = isMuted ? '#dc3545' : '#444';
}

function endCall() {
    clearInterval(callTimerInterval);
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    document.getElementById('duckieCallModal').style.display = 'none';
    document.getElementById('callVideo').srcObject = null;
}

function openSettings() {
    const modal = document.getElementById('duckieActionModal');
    document.getElementById('actionModalTitle').innerText = "Configuración y ajustes";
    document.getElementById('actionModalBody').innerHTML = `
        <button onclick="toggleFloatingTab()" style="width:100%; margin-bottom:8px; padding:10px; background:#28a745; color:white; border:none; border-radius:5px; text-align:left; cursor:pointer;">🪟 Mostrar/Ocultar Pestaña Flotante</button>
        <button onclick="openMediaLinks()" style="width:100%; margin-bottom:8px; padding:10px; background:#28a745; color:white; border:none; border-radius:5px; text-align:left; cursor:pointer;">📁 Media, Links and Duck</button>
        <button onclick="confirmDeleteAccount()" style="width:100%; margin-bottom:8px; padding:10px; background:#dc3545; color:white; border:none; border-radius:5px; text-align:left; cursor:pointer;">🗑️ Borrar Datos Locales</button>
    `;
    modal.style.display = 'flex';
}

function openDuckieMenu() {
    const modal = document.getElementById('duckieActionModal');
    document.getElementById('actionModalTitle').innerText = "Menú de Opciones";
    document.getElementById('actionModalBody').innerHTML = `
        <button onclick="showOfficialChannel()" style="width:100%; margin-bottom:8px; padding:10px; background:#28a745; color:white; border:none; border-radius:5px; text-align:left; cursor:pointer;">🛡️ Official Channel Verified</button>
        <button onclick="showPrivacyTerms()" style="width:100%; margin-bottom:8px; padding:10px; background:#28a745; color:white; border:none; border-radius:5px; text-align:left; cursor:pointer;">📄 Normas de Servicio y Privacidad</button>
        <button onclick="showTechSupport()" style="width:100%; margin-bottom:8px; padding:10px; background:#28a745; color:white; border:none; border-radius:5px; text-align:left; cursor:pointer;">🛠️ Soporte Técnico</button>
    `;
    modal.style.display = 'flex';
}

function toggleFloatingTab() {
    const tab = document.getElementById('floatingTab');
    tab.style.display = tab.style.display === 'block' ? 'none' : 'block';
    closeActionModal();
}

function showOfficialChannel() {
    document.getElementById('actionModalTitle').innerText = "Official Channel Verified";
    document.getElementById('actionModalBody').innerHTML = `<p style="color:#28a745; font-weight:bold;">Canal seguro y verificado activo (Servidor Starter) 🦆</p>`;
}

function showPrivacyTerms() {
    document.getElementById('actionModalTitle').innerText = "Normas de Servicio";
    document.getElementById('actionModalBody').innerHTML = `<p>Privacidad de datos y servidor dedicado activo en DuckieTalkPro.</p>`;
}

function showTechSupport() {
    document.getElementById('actionModalTitle').innerText = "Soporte Técnico";
    document.getElementById('actionModalBody').innerHTML = `<p>Asistencia activa desde el chat principal.</p>`;
}

function openMediaLinks() {
    document.getElementById('actionModalTitle').innerText = "Media & Links";
    document.getElementById('actionModalBody').innerHTML = `
        <a href="https://chataquin85-a11y.github.io/duckie-marketplace/" target="_blank" style="display:block; padding:8px; background:#28a745; color:white; text-decoration:none; border-radius:5px; text-align:center;">🛒 Ir a Duckie Marketplace</a>
    `;
}

function confirmDeleteAccount() {
    if (confirm("¿Borrar datos locales?")) { localStorage.clear(); location.reload(); }
}

function closeActionModal() {
    document.getElementById('duckieActionModal').style.display = 'none';
}
</script>
</body>
</html>
