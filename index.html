<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuckieTalk 1.1 - Ducke Talk Own Brand</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .font-default { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
        .font-clean { font-family: 'Segoe UI', Candara, sans-serif; letter-spacing: -0.01em; }
        .font-classic { font-family: Garamond, Baskerville, serif; }
        .font-comic { font-family: 'Comic Sans MS', 'Comic Sans', cursive; }

        .texture-dots {
            background-color: #0b0f19;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 16px 16px;
        }
        .texture-lines {
            background-color: #0b0f19;
            background-image: linear-gradient(#1e293b 1px, transparent 1px);
            background-size: 100% 24px;
        }
        .texture-grid {
            background-color: #0b0f19;
            background-image: linear-gradient(to right, #1e293b 1px, transparent 1px), linear-gradient(to bottom, #1e293b 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .settings-panel {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-2 font-default">

    <div id="appContainer" class="w-full max-w-md bg-[#0f172a] text-slate-100 rounded-3xl shadow-2xl overflow-hidden relative flex flex-col h-[780px] border-8 border-slate-900 transition-all duration-300">
        
        <header class="bg-[#0f172a] border-b border-slate-800 px-4 py-3 flex items-center justify-between z-10">
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 bg-amber-400 rounded-full flex items-center justify-center shadow-inner overflow-hidden border border-amber-500">
                    <svg viewBox="0 0 100 100" class="w-6 h-6 text-slate-950">
                        <path fill="currentColor" d="M30,40 C30,25 55,20 65,35 C70,32 78,35 82,40 C75,45 70,45 68,52 C60,65 35,65 30,52 C25,52 20,48 25,43 C28,43 30,42 30,40 Z" />
                        <circle cx="50" cy="35" r="4" fill="white" />
                        <circle cx="50" cy="35" r="2" fill="black" />
                    </svg>
                </div>
                <div>
                    <div class="flex items-center space-x-1.5">
                        <h1 class="text-sm font-bold tracking-tight text-white">DuckieTalk 1.1</h1>
                        <span class="text-emerald-400 text-xs">✓</span>
                    </div>
                    <span class="text-[10px] text-amber-500 font-extrabold uppercase tracking-widest block">Own Brand</span>
                </div>
            </div>

            <button id="settingsBtn" class="p-2 hover:bg-slate-800 rounded-full transition-colors text-slate-300 focus:outline-none" aria-label="Open Settings">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </header>

        <main id="workspace" class="flex-1 p-4 flex flex-col justify-between relative overflow-y-auto transition-all duration-300 bg-[#0f172a]">
            <div id="chatHistory" class="space-y-4">
                <div class="bg-[#1e293b] border border-slate-800 text-slate-200 p-4 rounded-2xl shadow-md max-w-[90%]">
                    <p class="text-xs leading-relaxed font-medium">
                        🦆 ¡Hola! Soy Duckie AI. Estoy listo para conversar contigo en tiempo real. Escribe algo o toca el patito amarillo abajo a la derecha.
                    </p>
                </div>
            </div>
        </main>

        <div class="bg-[#0b0f19] border-t border-slate-800 px-3 py-3 space-y-2.5">
            <div class="flex items-center space-x-2 overflow-x-auto pb-1 text-xs font-semibold">
                <button onclick="toggleTray('emojiTray')" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg transition-colors flex items-center space-x-1">✨ <span>Emoji</span></button>
                <button onclick="toggleTray('gifTray')" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg transition-colors flex items-center space-x-1">👾 <span>GIF</span></button>
                <button onclick="toggleTray('stickerTray')" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg transition-colors flex items-center space-x-1">🎨 <span>Sticker</span></button>
                <button onclick="triggerDuckieAI()" class="px-3 py-1 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-lg transition-colors flex items-center space-x-1">🦆 <span>Duckie</span></button>
            </div>

            <div id="emojiTray" class="media-tray hidden bg-[#131b2e] border border-slate-800 p-3 rounded-2xl grid grid-cols-6 gap-2 text-center text-lg shadow-inner">
                <button onclick="insertItem('😀')" class="hover:bg-slate-800 p-1.5 rounded-xl transition-colors">😀</button>
                <button onclick="insertItem('🚀')" class="hover:bg-slate-800 p-1.5 rounded-xl transition-colors">🚀</button>
                <button onclick="insertItem('🔥')" class="hover:bg-slate-800 p-1.5 rounded-xl transition-colors">🔥</button>
                <button onclick="insertItem('🎉')" class="hover:bg-slate-800 p-1.5 rounded-xl transition-colors">🎉</button>
                <button onclick="insertItem('❤️')" class="hover:bg-slate-800 p-1.5 rounded-xl transition-colors">❤️</button>
                <button onclick="insertItem('✨')" class="hover:bg-slate-800 p-1.5 rounded-xl transition-colors">✨</button>
            </div>

            <div id="gifTray" class="media-tray hidden bg-[#131b2e] border border-slate-800 p-3 rounded-2xl grid grid-cols-3 gap-2 text-center text-xs text-slate-300">
                <button onclick="insertItem('[GIF: Party Duck]')" class="bg-slate-800 hover:bg-slate-700 p-2 rounded-xl">🎉 Party Duck</button>
                <button onclick="insertItem('[GIF: Coding Duck]')" class="bg-slate-800 hover:bg-slate-700 p-2 rounded-xl">💻 Coding Duck</button>
                <button onclick="insertItem('[GIF: Happy Duck]')" class="bg-slate-800 hover:bg-slate-700 p-2 rounded-xl">🌟 Happy Duck</button>
            </div>

            <div id="stickerTray" class="media-tray hidden bg-[#131b2e] border border-slate-800 p-3 rounded-2xl grid grid-cols-3 gap-2 text-center text-xs text-amber-300">
                <button onclick="insertItem('[Sticker: 🦆 Quack!]')" class="bg-slate-800 hover:bg-slate-700 p-2 rounded-xl">🦆 Quack!</button>
                <button onclick="insertItem('[Sticker: ⭐ Pro]')" class="bg-slate-800 hover:bg-slate-700 p-2 rounded-xl">⭐ Pro</button>
                <button onclick="insertItem('[Sticker: 🚀 Fast]')" class="bg-slate-800 hover:bg-slate-700 p-2 rounded-xl">🚀 Fast</button>
            </div>

            <div class="flex items-center space-x-2">
                <input type="text" id="userInput" placeholder="talk to Duckie..." onkeypress="handleKeyPress(event)" class="flex-1 bg-[#162032] border border-slate-700/60 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-amber-500">
                
                <button onclick="triggerDuckieAI()" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition-colors" title="AI Help">?</button>
                <button onclick="insertItem('[Attachment]')" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition-colors" title="Attach Media">📎</button>
                <button onclick="triggerDuckieAI()" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition-colors" title="Voice Input">🎤</button>
                
                <button onclick="triggerDuckieAI()" class="w-11 h-11 bg-amber-400 hover:bg-amber-300 rounded-xl flex items-center justify-center shadow-md overflow-hidden border border-amber-500 transition-transform active:scale-95 flex-shrink-0" title="Chat with Duckie AI">
                    <svg viewBox="0 0 100 100" class="w-7 h-7 text-slate-950">
                        <path fill="currentColor" d="M30,40 C30,25 55,20 65,35 C70,32 78,35 82,40 C75,45 70,45 68,52 C60,65 35,65 30,52 C25,52 20,48 25,43 C28,43 30,42 30,40 Z" />
                        <circle cx="50" cy="35" r="4" fill="white" />
                        <circle cx="50" cy="35" r="2" fill="black" />
                    </svg>
                </button>
            </div>
        </div>

        <div id="settingsPanel" class="settings-panel absolute inset-x-0 bottom-0 bg-white text-slate-900 border-t border-slate-200 rounded-t-3xl shadow-2xl p-6 z-20 transform translate-y-full opacity-0 pointer-events-none">
            <div class="flex flex-col items-center mb-4">
                <div class="w-12 h-1.5 bg-slate-200 rounded-full mb-3"></div>
                <div class="w-full flex justify-between items-center">
                    <h2 class="text-lg font-bold text-slate-900">Theme Settings</h2>
                    <button id="closeSettingsBtn" class="text-xs font-bold text-amber-700 bg-amber-100 hover:bg-amber-200 px-3 py-1.5 rounded-full transition-colors">
                        Done
                    </button>
                </div>
            </div>

            <div class="space-y-5 overflow-y-auto max-h-[380px] pr-1">
                <div>
                    <label class="block text-[10px] font-extrabold uppercase tracking-widest text-slate-400 mb-2.5">Background Color</label>
                    <div class="grid grid-cols-5 gap-3">
                        <button onclick="changeBgColor('#0f172a', this)" class="color-swatch h-10 w-10 rounded-xl bg-slate-900 border-2 border-amber-500 ring-4 ring-amber-500/20 shadow-sm transition-all"></button>
                        <button onclick="changeBgColor('#fee2e2', this)" class="color-swatch h-10 w-10 rounded-xl bg-red-100 border border-slate-200 shadow-sm transition-all"></button>
                        <button onclick="changeBgColor('#fef3c7', this)" class="color-swatch h-10 w-10 rounded-xl bg-amber-100 border border-slate-200 shadow-sm transition-all"></button>
                        <button onclick="changeBgColor('#dcfce7', this)" class="color-swatch h-10 w-10 rounded-xl bg-emerald-100 border border-slate-200 shadow-sm transition-all"></button>
                        <button onclick="changeBgColor('#e0f2fe', this)" class="color-swatch h-10 w-10 rounded-xl bg-sky-100 border border-slate-200 shadow-sm transition-all"></button>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-extrabold uppercase tracking-widest text-slate-400 mb-2.5">Add Different Textures</label>
                    <div class="grid grid-cols-2 gap-2.5">
                        <button onclick="changeTexture('', this)" class="texture-btn py-2 px-3 border-2 border-amber-500 bg-amber-50 text-amber-700 rounded-xl text-xs font-bold transition-all">None (Solid)</button>
                        <button onclick="changeTexture('texture-dots', this)" class="texture-btn py-2 px-3 border border-slate-200 bg-white text-slate-700 rounded-xl text-xs font-semibold hover:bg-slate-50 transition-all">Polka Dot</button>
                        <button onclick="changeTexture('texture-lines', this)" class="texture-btn py-2 px-3 border border-slate-200 bg-white text-slate-700 rounded-xl text-xs font-semibold hover:bg-slate-50 transition-all">Horizontal Lines</button>
                        <button onclick="changeTexture('texture-grid', this)" class="texture-btn py-2 px-3 border border-slate-200 bg-white text-slate-700 rounded-xl text-xs font-semibold hover:bg-slate-50 transition-all">Blueprint Grid</button>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-extrabold uppercase tracking-widest text-slate-400 mb-2.5">Typography</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="changeFont('font-default', this)" class="font-btn p-2.5 border-2 border-amber-500 bg-amber-50 text-slate-900 rounded-xl text-left text-xs font-bold transition-all font-default">Default (Sans)</button>
                        <button onclick="changeFont('font-clean', this)" class="font-btn p-2.5 border border-slate-200 bg-white text-slate-700 rounded-xl text-left text-xs font-medium hover:bg-slate-50 transition-all font-clean">Clean (Segoe UI)</button>
                        <button onclick="changeFont('font-classic', this)" class="font-btn p-2.5 border border-slate-200 bg-white text-slate-700 rounded-xl text-left text-xs font-medium hover:bg-slate-50 transition-all font-classic">Classic (Serif)</button>
                        <button onclick="changeFont('font-comic', this)" class="font-btn p-2.5 border border-slate-200 bg-white text-slate-700 rounded-xl text-left text-xs font-medium hover:bg-slate-50 transition-all font-comic">Comic Sans Differents</button>
                    </div>
                </div>

                <div class="pt-1">
                    <button onclick="resetDefaults()" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold text-xs transition-colors">Reset Defaults</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Settings Panel Interactivity
        const settingsBtn = document.getElementById('settingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        let isSettingsOpen = false;

        function toggleSettings() {
            isSettingsOpen = !isSettingsOpen;
            if (isSettingsOpen) {
                settingsPanel.classList.remove('translate-y-full', 'opacity-0', 'pointer-events-none');
                settingsPanel.classList.add('translate-y-0', 'opacity-100');
            } else {
                settingsPanel.classList.remove('translate-y-0', 'opacity-100');
                settingsPanel.classList.add('translate-y-full', 'opacity-0', 'pointer-events-none');
            }
        }
        settingsBtn.addEventListener('click', toggleSettings);
        closeSettingsBtn.addEventListener('click', toggleSettings);

        // Customization Functions
        const workspace = document.getElementById('workspace');
        const appContainer = document.getElementById('appContainer');

        function changeBgColor(color, element) {
            workspace.style.backgroundColor = color;
            document.querySelectorAll('.color-swatch').forEach(btn => {
                btn.classList.remove('border-amber-500', 'ring-4', 'ring-amber-500/20');
                btn.classList.add('border-slate-200');
            });
            element.classList.remove('border-slate-200');
            element.classList.add('border-amber-500', 'ring-4', 'ring-amber-500/20');
        }

        function changeTexture(textureClass, element) {
            workspace.classList.remove('texture-dots', 'texture-lines', 'texture-grid');
            if (textureClass) { workspace.classList.add(textureClass); }
            document.querySelectorAll('.texture-btn').forEach(btn => {
                btn.classList.remove('border-amber-500', 'bg-amber-50', 'text-amber-700', 'font-bold');
                btn.classList.add('border-slate-200', 'bg-white', 'text-slate-700', 'font-semibold');
            });
            element.classList.remove('border-slate-200', 'bg-white', 'text-slate-700', 'font-semibold');
            element.classList.add('border-amber-500', 'bg-amber-50', 'text-amber-700', 'font-bold');
        }

        function changeFont(fontClass, element) {
            appContainer.classList.remove('font-default', 'font-clean', 'font-classic', 'font-comic');
            appContainer.classList.add(fontClass);
            document.querySelectorAll('.font-btn').forEach(btn => {
                btn.classList.remove('border-amber-500', 'bg-amber-50', 'font-bold');
                btn.classList.add('border-slate-200', 'bg-white', 'font-medium');
            });
            element.classList.remove('border-slate-200', 'bg-white', 'font-medium');
            element.classList.add('border-amber-500', 'bg-amber-50', 'font-bold');
        }

        function resetDefaults() {
            changeBgColor('#0f172a', document.querySelectorAll('.color-swatch')[0]);
            changeTexture('', document.querySelectorAll('.texture-btn')[0]);
            changeFont('font-default', document.querySelectorAll('.font-btn')[0]);
        }

        // Multimedia Trays Toggle
        function toggleTray(trayId) {
            document.querySelectorAll('.media-tray').forEach(tray => {
                if (tray.id !== trayId) tray.classList.add('hidden');
            });
            document.getElementById(trayId).classList.toggle('hidden');
        }

        function insertItem(symbol) {
            const input = document.getElementById('userInput');
            input.value += symbol;
            document.querySelectorAll('.media-tray').forEach(tray => tray.classList.add('hidden'));
            input.focus();
        }

        // Real-Time AI Chat Functionality
        function triggerDuckieAI() {
            const chatHistory = document.getElementById('chatHistory');
            const aiMsg = document.createElement('div');
            aiMsg.className = 'bg-[#1e293b] border border-slate-700 text-amber-300 p-3.5 rounded-2xl shadow-md max-w-[90%]';
            aiMsg.innerHTML = `🦆 <strong>Duckie AI en Vivo:</strong> ¡Hola! ¿En qué te ayudo hoy en duckiethemus.com?`;
            chatHistory.appendChild(aiMsg);
            workspace.scrollTop = workspace.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                const input = document.getElementById('userInput');
                const text = input.value.trim();
                if(!text) return;

                const chatHistory = document.getElementById('chatHistory');
                
                // User message card
                const userMsg = document.createElement('div');
                userMsg.className = 'bg-amber-500 text-slate-950 font-medium p-3.5 rounded-2xl shadow-md max-w-[90%] ml-auto';
                userMsg.textContent = text;
                chatHistory.appendChild(userMsg);
                
                input.value = '';
                document.querySelectorAll('.media-tray').forEach(tray => tray.classList.add('hidden'));
                workspace.scrollTop = workspace.scrollHeight;

                // Real-Time typing simulation
                const typingMsg = document.createElement('div');
                typingMsg.className = 'bg-[#1e293b] border border-slate-800 text-slate-400 p-3 rounded-2xl shadow-md max-w-[50%] text-xs italic animate-pulse';
                typingMsg.textContent = 'Duckie está escribiendo...';
                chatHistory.appendChild(typingMsg);
                workspace.scrollTop = workspace.scrollHeight;

                // Real-time instant reply
                setTimeout(() => {
                    chatHistory.removeChild(typingMsg);
                    const replyMsg = document.createElement('div');
                    replyMsg.className = 'bg-[#1e293b] border border-slate-800 text-slate-200 p-3.5 rounded-2xl shadow-md max-w-[90%]';
                    replyMsg.innerHTML = `🦆 <strong>Duckie AI:</strong> ¡Entendido perfectamente! Procesé tu mensaje <em>"${text}"</em> en tiempo real con éxito.`;
                    chatHistory.appendChild(replyMsg);
                    workspace.scrollTop = workspace.scrollHeight;
                }, 500);
            }
        }
    </script>
</body>
</html>
