<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DuckieDuck Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="content=yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DuckieTalkPro">
    <link rel="apple-touch-icon" href="IMG_1101.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b2e13; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Header */
        header { background: #07220e; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #14451f; z-index: 10; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-logo { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; }
        .header-title { font-size: 1.1em; font-weight: bold; color: #4ec9b0; }
        .header-subtitle { font-size: 0.75em; color: #858585; }
        .header-actions { display: flex; gap: 12px; align-items: center; }
        .header-actions button { background: none; border: none; color: #ffffff; font-size: 1.2em; cursor: pointer; }

        /* Store / Partner Banner */
        .store-banner { background: #14451f; padding: 6px 15px; font-size: 0.75em; color: #ffeb3b; text-align: center; border-bottom: 1px solid #1f5e2b; }

        /* Chat Container */
        .chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #0b2e13; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 0.95em; line-height: 1.4; word-wrap: break-word; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .incoming { background-color: #14451f; align-self: flex-start; border-top-left-radius: 0; }
        .outgoing { background-color: #1b5e20; align-self: flex-end; border-top-right-radius: 0; }

        /* Input Controls Area */
        .input-area { background: #07220e; padding: 10px 15px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #14451f; }
        .input-area input { flex: 1; background: #14451f; border: 1px solid #1f5e2b; border-radius: 20px; padding: 10px 15px; color: #fff; font-size: 0.95em; outline: none; }
        .input-area input::placeholder { color: #858585; }
        .send-btn { background: #2e7d32; border: none; color: white; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .send-btn:active { background: #1b5e20; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <img src="IMG_1101.png" alt="Logo" class="header-logo">
            <div>
                <div class="header-title">DuckieTalkPro</div>
                <div class="header-subtitle">DuckieTalk ^+^ /</div>
            </div>
        </div>
        <div class="header-actions">
            <button title="Ajustes" onclick="openSettings()">⚙️</button>
        </div>
    </header>

    <div class="store-banner">
        🦆 DuckieTalkPro - VoIP y Sistema Seguro Activo
    </div<div style="padding: 10px; background: #111; display: flex; gap: 10px; justify-content: center;">
    <button onclick="startVoiceCall()" style="background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">📞 Llamada de Voz</button>
    <button onclick="startVideoCall()" style="background: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">📹 Videollamada</button>
</div>

    <div class="chat-container" id="chatLog">
        <div class="message incoming">
            DuckieTalk IA: ¡Bienvenido a tu canal verificado seguro Amado! Sistema VoIP y comandos activos en tiempo real. 🦆✨
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Escribe un mensaje seguro...">
        <button class="send-btn" id="sendBtn">Enviar</button>
    </div>

    <!-- Script de Integración de Chat e IA -->
    <script>
        const chatLog = document.getElementById('chatLog');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Mostrar mensaje del usuario en pantalla
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message outgoing';
            userMsgDiv.textContent = 'Tú: ' + text;
            chatLog.appendChild(userMsgDiv);
            
            userInput.value = '';
            chatLog.scrollTop = chatLog.scrollHeight;

            // Mensaje temporal de espera
            const waitingDiv = document.createElement('div');
            waitingDiv.className = 'message incoming';
            waitingDiv.textContent = 'DuckieTalk IA: Pensando respuesta... 🦆';
            chatLog.appendChild(waitingDiv);
            chatLog.scrollTop = chatLog.scrollHeight;

            try {
                // Llamada real al backend en Render
                const response = await fetch('https://duckietalkpro.onrender.com/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                
                // Actualizar con la respuesta real del servidor/IA
                waitingDiv.textContent = 'DuckieTalk IA: ' + (data.reply || '¡Quack! Respuesta recibida.');
            } catch (error) {
                console.error("Error conectando al backend:", error);
                waitingDiv.textContent = 'DuckieTalk IA: ¡Quack! Error de conexión con el servidor remoto.';
            }
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSendMessage();
        });
    </script>
<!-- Modal / Pantalla Flotante de Llamada Estilo Messenger / WhatsApp -->
<div id="duckieCallModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; justify-content:center; align-items:center; flex-direction:column; font-family:sans-serif; color:white;">
    <div style="background:#111; padding:30px; border-radius:20px; text-align:center; width:320px; box-shadow:0 10px 25px rgba(0,0,0,0.5); border: 2px solid #28a745;">
        <h3 id="callTitle" style="margin-bottom:10px; color:#28a745;">DuckieCall VoIP</h3>
        <p id="callStatus" style="font-size:14px; color:#bbb; margin-bottom:20px;">Conectando...</p>
        
        <!-- Contenedor de Video -->
        <video id="callVideo" autoplay playsinline style="width:100%; height:180px; background:#000; border-radius:10px; display:none; object-fit:cover; margin-bottom:15px;"></video>
        
        <!-- Temporizador -->
        <div id="callTimer" style="font-size:18px; font-weight:bold; margin-bottom:25px;">00:00</div>
        
        <!-- Controles de Llamada -->
        <div style="display:flex; justify-content:space-around; width:100%;">
            <button onclick="toggleMute()" id="muteBtn" style="background:#444; border:none; color:white; padding:12px; border-radius:50%; cursor:pointer; font-size:16px;">🎤</button>
            <button onclick="endCall()" style="background:#dc3545; border:none; color:white; padding:12px 25px; border-radius:30px; cursor:pointer; font-weight:bold;">Colgar</button>
        </div>
    </div>
</div>

<script>
    let callTimerInterval;
    let callSeconds = 0;
    let localStream = null;
    let isMuted = false;

    function startVoiceCall() {
        const modal = document.getElementById('duckieCallModal');
        const videoEl = document.getElementById('callVideo');
        const titleEl = document.getElementById('callTitle');
        
        videoEl.style.display = 'none';
        titleEl.innerText = "DuckieCall - Voz";
        modal.style.display = 'flex';
        
        startCallTimer();
    }

    async function startVideoCall() {
        const modal = document.getElementById('duckieCallModal');
        const videoEl = document.getElementById('callVideo');
        const titleEl = document.getElementById('callTitle');
        
        titleEl.innerText = "DuckieCall - Video";
        videoEl.style.display = 'block';
        modal.style.display = 'flex';

        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            videoEl.srcObject = localStream;
        } catch (error) {
            console.error("Error al acceder a la cámara:", error);
            alert("No se pudo acceder a la cámara o micrófono.");
        }

        startCallTimer();
    }

    function startCallTimer() {
        callSeconds = 0;
        document.getElementById('callStatus').innerText = "En llamada...";
        callTimerInterval = setInterval(() => {
            callSeconds++;
            let mins = Math.floor(callSeconds / 60).toString().padStart(2, '0');
            let secs = (callSeconds % 60).toString().padStart(2, '0');
            document.getElementById('callTimer').innerText = `${mins}:${secs}`;
        }, 1000);
    }

    function toggleMute() {
        isMuted = !isMuted;
        if (localStream) {
            localStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
        }
        document.getElementById('muteBtn').style.background = isMuted ? '#dc3545' : '#444';
    }

    function endCall() {
        clearInterval(callTimerInterval);
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
        document.getElementById('duckieCallModal').style.display = 'none';
        document.getElementById('callVideo').srcObject = null;
        isMuted = false;
        document.getElementById('muteBtn').style.background = '#444';
    }

    // Exponer funciones globalmente
    window.startVoiceCall = startVoiceCall;
    window.startVideoCall = startVideoCall;
</script>
</body>
</html>
