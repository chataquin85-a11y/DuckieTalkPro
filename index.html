<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DuckieTalkPro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DuckieTalkPro">
    <link rel="apple-touch-icon" href="IMG_1101.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b2e13; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Cabecera */
        header { background: #07220e; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #14451f; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-logo { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; }
        .header-title { font-size: 16px; font-weight: bold; }
        .header-subtitle { font-size: 11px; color: #a3cfbb; }
        .header-icons { display: flex; gap: 15px; font-size: 18px; cursor: pointer; }

        /* Área de Chat */
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background-color: #0b2e13; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; }
        .message.ai { background-color: #14451f; color: #fff; align-self: flex-start; border-top-left-radius: 2px; }
        .message.user { background-color: #198754; color: #fff; align-self: flex-end; border-top-right-radius: 2px; }

        /* Barra Inferior */
        .chat-input-bar { background: #07220e; padding: 10px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #14451f; position: relative; }
        .chat-input-bar button { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; padding: 5px; }
        .chat-input-bar input { flex: 1; background: #14451f; border: none; border-radius: 20px; padding: 10px 15px; color: #fff; font-size: 14px; outline: none; }
        .chat-input-bar input::placeholder { color: #a3cfbb; }

        /* Menús Flotantes (Hamburguesa y Engrane) */
        .modal-menu { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #0e3518; width: 85%; max-width: 350px; border-radius: 15px; padding: 20px; border: 1px solid #198754; display: flex; flex-direction: column; gap: 12px; }
        .modal-content h3 { font-size: 18px; color: #a3cfbb; margin-bottom: 5px; border-bottom: 1px solid #14451f; padding-bottom: 8px; }
        .modal-btn { background: #14451f; color: #fff; border: none; padding: 12px; border-radius: 8px; text-align: left; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background 0.2s; }
        .modal-btn:hover { background: #198754; }
        .close-modal { background: #dc3545; text-align: center; justify-content: center; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Cabecera -->
    <header>
        <div class="header-left">
            <span id="menu-burger" style="font-size: 22px; cursor: pointer; margin-right: 5px;">☰</span>
            <img src="IMG_1101.png" alt="Logo" class="header-logo">
            <div>
                <div class="header-title">DuckieTalkPro</div>
                <div class="header-subtitle">DuckieTalk ^+^ ↵</div>
            </div>
        </div>
        <div class="header-icons">
            <span id="btn-settings">⚙️</span>
        </div>
    </header>

    <!-- Contenedor de Mensajes -->
    <div id="chat-container">
        <div class="message ai">
            <strong>DuckieTalk IA:</strong> ¡Bienvenido a tu canal verificado seguro Amado! Sistema VoIP, IA y comandos activos en tiempo real. 🦆✨
        </div>
    </div>

    <!-- Barra de Entrada y Multimedia -->
    <div class="chat-input-bar">
        <button id="btn-clip">📎</button>
        <button id="btn-emoji">😊</button>
        <input type="text" id="user-input" placeholder="Escribe un mensaje seguro...">
        <button id="btn-mic">🎙️</button>
        <button id="btn-send">🚀</button>
    </div>

    <!-- Menú Hamburguesa (Flotante) -->
    <div id="burger-modal" class="modal-menu">
        <div class="modal-content">
            <h3>Menú Opciones</h3>
            <button class="modal-btn">🛡️ Official Channel Verified</button>
            <button class="modal-btn">📄 Normas de Servicio y Privacidad</button>
            <button class="modal-btn">💬 Advanced Chat Privacy</button>
            <button class="modal-btn">🛠️ Soporte Técnico</button>
            <button class="modal-btn close-modal" onclick="closeModals()">Cerrar</button>
        </div>
    </div>

    <!-- Menú de Configuración / Engrane (Flotante) -->
    <div id="settings-modal" class="modal-menu">
        <div class="modal-content">
            <h3>Configuración & Ajustes</h3>
            <button class="modal-btn">📁 Media, Links and Duck</button>
            <button class="modal-btn">🏪 Manage Store</button>
            <button class="modal-btn">👥 Add Contacts & Groups</button>
            <button class="modal-btn">🔔 Notificaciones</button>
            <button class="modal-btn" style="color: #ff6b6b;">🗑️ Borrar Cuenta</button>
            <button class="modal-btn close-modal" onclick="closeModals()">Cerrar</button>
        </div>
    </div>

    <!-- Script de lógica integrado -->
    <script src="script.js"></script>
</body>
</html>
