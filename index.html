async function handleSendMessage() {
    const input = document.getElementById('userInput');
    const chatLog = document.getElementById('chatLog');
    const text = input.value.trim();

    if (!text) return;

    // 1. Mostrar mensaje del usuario en el chat
    chatLog.innerHTML += `<div class="message outgoing" style="text-align:right; margin:10px 0;"><span style="background:#28a745; padding:8px 12px; border-radius:10px; display:inline-block;">Tú: ${text}</span></div>`;
    input.value = '';
    chatLog.scrollTop = chatLog.scrollHeight;

    // 2. Mostrar indicador de "escribiendo..."
    const loadingId = 'loading-' + Date.now();
    chatLog.innerHTML += `<div id="${loadingId}" class="message incoming" style="margin:10px 0;"><span style="background:#444; padding:8px 12px; border-radius:10px; display:inline-block;">DuckieTalk IA está pensando... 🦆</span></div>`;
    chatLog.scrollTop = chatLog.scrollHeight;

    try {
        // Opción A: Si tienes un endpoint en tu backend de Render (ej. /api/chat)
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
        });

        const data = await response.json();
        
        // Remover indicador de carga
        document.getElementById(loadingId).remove();

        // Mostrar respuesta real de la IA
        if (data.reply) {
            chatLog.innerHTML += `<div class="message incoming" style="margin:10px 0;"><span style="background:#333; padding:8px 12px; border-radius:10px; display:inline-block;">DuckieTalk IA: ${data.reply}</span></div>`;
        } else {
            chatLog.innerHTML += `<div class="message incoming" style="margin:10px 0;"><span style="background:#333; padding:8px 12px; border-radius:10px; display:inline-block;">DuckieTalk IA: ¡Quack! Recibí respuesta vacía del servidor.</span></div>`;
        }
    } catch (error) {
        // Remover indicador de carga en caso de error
        const loader = document.getElementById(loadingId);
        if (loader) loader.remove();

        chatLog.innerHTML += `<div class="message incoming" style="margin:10px 0;"><span style="background:#dc3545; padding:8px 12px; border-radius:10px; display:inline-block;">DuckieTalk IA: Error de conexión con el servidor remoto. 🚨</span></div>`;
    }

    chatLog.scrollTop = chatLog.scrollHeight;
}

<script>
    let callTimerInterval;
    let callSeconds = 0;
    let localStream = null;
    let isMuted = false;

    function startVoiceCall() {
        const modal = document.getElementById('duckieCallModal');
        const videoEl = document.getElementById('callVideo');
        const titleEl = document.getElementById('callTitle');
        
        videoEl.style.display = 'none';
        titleEl.innerText = "DuckieCall - Voz";
        modal.style.display = 'flex';
        
        startCallTimer();
    }

    async function startVideoCall() {
        const modal = document.getElementById('duckieCallModal');
        const videoEl = document.getElementById('callVideo');
        const titleEl = document.getElementById('callTitle');
        
        titleEl.innerText = "DuckieCall - Video";
        videoEl.style.display = 'block';
        modal.style.display = 'flex';

        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            videoEl.srcObject = localStream;
        } catch (error) {
            console.error("Error al acceder a la cámara:", error);
            alert("No se pudo acceder a la cámara o micrófono.");
        }

        startCallTimer();
    }

    function startCallTimer() {
        callSeconds = 0;
        document.getElementById('callStatus').innerText = "En llamada...";
        callTimerInterval = setInterval(() => {
            callSeconds++;
            let mins = Math.floor(callSeconds / 60).toString().padStart(2, '0');
            let secs = (callSeconds % 60).toString().padStart(2, '0');
            document.getElementById('callTimer').innerText = `${mins}:${secs}`;
        }, 1000);
    }

    function toggleMute() {
        isMuted = !isMuted;
        if (localStream) {
            localStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
        }
        document.getElementById('muteBtn').style.background = isMuted ? '#dc3545' : '#444';
    }

    function endCall() {
        clearInterval(callTimerInterval);
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
        document.getElementById('duckieCallModal').style.display = 'none';
        document.getElementById('callVideo').srcObject = null;
        isMuted = false;
        document.getElementById('muteBtn').style.background = '#444';
    }
