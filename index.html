<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daki Jack Pro - Asistente Personal</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .app-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            max-width: 650px;
            width: 100%;
            display: flex;
            flex-direction: column;
            height: 80vh;
            max-height: 700px;
        }
        h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 5px;
        }
        .status-badge {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 15px;
            align-self: flex-start;
        }
        .chat-box {
            flex: 1;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            background: #f1f5f9;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.4;
            font-size: 0.95rem;
        }
        .user-message {
            background: var(--primary-color);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .assistant-message {
            background: white;
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: var(--primary-color);
        }
        button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <span class="status-badge">Asistente Personal Activo</span>
        <h1>Daki Jack Pro</h1>
        
        <div id="chatBox" class="chat-box">
            <div class="message assistant-message">
                ¡Hola! Soy tu asistente personal Daki Jack Pro. Pídeme lo que necesites: recetas de cocina, opciones de organización o cualquier idea que quieras desarrollar.
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ej. Dame una receta de pastel de fresa..." autocomplete="off">
            <button id="sendBtn">Enviar</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');
            messageDiv.classList.add(sender === 'user' ? 'user-message' : 'assistant-message');
            messageDiv.textContent = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleUserMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';

            // Lógica base de respuesta del asistente personal
            setTimeout(() => {
                let response = "Entendido. Estoy procesando tu solicitud para darte las mejores opciones.";
                
                const lowerText = text.toLowerCase();
                if (lowerText.includes('pastel') || lowerText.includes('fresa') || lowerText.includes('receta')) {
                    response = "Aquí tienes opciones para tu pastel de fresa:\n1. Pastel clásico con crema batida y fresas naturales.\n2. Pastel de tres leches con topping de fresa.\n3. Cheesecake frío de fresa.\n¿Cuál de estas opciones te gustaría preparar?";
                } else if (lowerText.includes('hola') || lowerText.includes('saludos')) {
                    response = "¡Hola de nuevo! ¿En qué te ayudo hoy con tus proyectos o tus tareas personales?";
                }

                appendMessage(response, 'assistant');
            }, 600);
        }

        sendBtn.addEventListener('click', handleUserMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleUserMessage();
            }
        });
    </script>
</body>
</html>
