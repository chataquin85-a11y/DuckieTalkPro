<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ducke Talk - Own Brand</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom typography definitions matching the user spec */
        .font-default {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .font-clean {
            font-family: 'Segoe UI', Candara, 'Bitstream Vera Sans', 'DejaVu Sans', sans-serif;
            letter-spacing: -0.01em;
        }
        .font-classic {
            font-family: Garamond, Baskerville, 'Baskerville Old Face', 'Hoefler Text', 'Times New Roman', serif;
        }
        .font-comic {
            font-family: 'Comic Sans MS', 'Comic Sans', cursive;
        }

        /* Textured Background Options */
        .texture-dots {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 16px 16px;
        }
        .texture-lines {
            background-color: #f8fafc;
            background-image: linear-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 100% 24px;
        }
        .texture-grid {
            background-color: #f8fafc;
            background-image: linear-gradient(to right, #e2e8f0 1px, transparent 1px), linear-gradient(to bottom, #e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Smooth UI Transitions */
        .settings-panel {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-2 font-default">

    <!-- Main Container replicating mobile card interface from screenshots -->
    <div id="appContainer" class="w-full max-w-md bg-white text-slate-900 rounded-3xl shadow-2xl overflow-hidden relative flex flex-col h-[750px] border-8 border-slate-900 transition-all duration-300">
        
        <!-- Top App Bar / Header -->
        <header class="bg-white border-b border-slate-100 px-5 py-4 flex items-center justify-between z-10">
            <div class="flex items-center space-x-3">
                <!-- Permanent Duck Brand Logo Component -->
                <div class="w-10 h-10 bg-amber-400 rounded-full flex items-center justify-center shadow-inner overflow-hidden border border-amber-500">
                    <svg viewBox="0 0 100 100" class="w-7 h-7 text-slate-950">
                        <path fill="currentColor" d="M30,40 C30,25 55,20 65,35 C70,32 78,35 82,40 C75,45 70,45 68,52 C60,65 35,65 30,52 C25,52 20,48 25,43 C28,43 30,42 30,40 Z" />
                        <circle cx="50" cy="35" r="4" fill="white" />
                        <circle cx="50" cy="35" r="2" fill="black" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-tight text-slate-900">Ducke Talk</h1>
                    <span class="text-[10px] text-amber-600 font-extrabold uppercase tracking-widest block -mt-1">OWN BRAND</span>
                </div>
            </div>

            <!-- Interactive Settings Gear Button -->
            <button id="settingsBtn" class="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-700 focus:outline-none" aria-label="Open Theme Settings">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </header>

        <!-- Main Workspace Area -->
        <main id="workspace" class="flex-1 p-5 flex flex-col justify-between relative overflow-y-auto transition-all duration-300 bg-slate-50">
            <div id="textContent" class="space-y-4 my-auto">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 max-w-[85%]">
                    <p class="text-xs font-bold text-amber-600 mb-1 uppercase tracking-wider">System Message</p>
                    <p class="text-sm text-slate-800 leading-relaxed font-medium">
                        "Just change background theme settings"
                    </p>
                </div>

                <div class="bg-amber-500 text-white p-5 rounded-2xl shadow-sm max-w-[85%] self-end ml-auto">
                    <p class="text-xs font-bold opacity-90 mb-1 uppercase tracking-wider">User Guide</p>
                    <p class="text-sm leading-relaxed font-medium">
                        Tap the settings cog icon in the top right to customize background colors, explore multiple textures, or transform the layout typography live!
                    </p>
                </div>
            </div>
            <p class="text-[11px] text-center text-slate-400 mt-4 pointer-events-none font-semibold">Ducke Talk Framework v1.0</p>
        </main>

        <!-- Bottom Quick Tools Bar (Inspired by Capture 11 & 12) -->
        <div class="bg-white border-t border-slate-100 px-4 py-3 flex items-center justify-between text-xs font-semibold text-slate-600">
            <button class="flex items-center space-x-1 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors text-slate-700">✨ <span>Emoji</span></button>
            <button class="flex items-center space-x-1 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors text-slate-700">👾 <span>GIF</span></button>
            <button class="flex items-center space-x-1 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors text-slate-700">🎨 <span>Sticker</span></button>
            <button class="flex items-center space-x-1 px-3 py-1.5 bg-amber-50 hover:bg-amber-100 rounded-lg transition-colors text-amber-700">🦆 <span>Duckie</span></button>
        </div>

        <!-- Sliding Theme & Settings Sheet Overlay (Capture 14 style) -->
        <div id="settingsPanel" class="settings-panel absolute inset-x-0 bottom-0 bg-white border-t border-slate-200 rounded-t-3xl shadow-2xl p-6 z-20 transform translate-y-full opacity-0 pointer-events-none">
            <div class="flex flex-col items-center mb-4">
                <div class="w-12 h-1.5 bg-slate-200 rounded-full mb-3"></div>
                <div class="w-full flex justify-between items-center">
                    <h2 class="text-lg font-bold text-slate-900">Theme Settings</h2>
                    <button id="closeSettingsBtn" class="text-xs font-bold text-amber-700 bg-amber-100 hover:bg-amber-200 px-3 py-1.5 rounded-full transition-colors">
                        Done
                    </button>
                </div>
            </div>

            <div class="space-y-5 overflow-y-auto max-h-[380px] pr-1">
                <!-- Section 1: Background Colors -->
                <div>
                    <label class="block text-[10px] font-extrabold uppercase tracking-widest text-slate-400 mb-2.5">Background Color</label>
                    <div class="grid grid-cols-5 gap-3">
                        <button onclick="changeBgColor('#f8fafc', this)" class="color-swatch h-10 w-10 rounded-xl bg-slate-50 border-2 border-amber-500 ring-4 ring-amber-500/20 shadow-sm relative transition-all"></button>
                        <button onclick="changeBgColor('#fee2e2', this)" class="color-swatch h-10 w-10 rounded-xl bg-red-100 border border-slate-200 shadow-sm transition-all"></button>
                        <button onclick="changeBgColor('#fef3c7', this)" class="color-swatch h-10 w-10 rounded-xl bg-amber-100 border border-slate-200 shadow-sm transition-all"></button>
                        <button onclick="changeBgColor('#dcfce7', this)" class="color-swatch h-10 w-10 rounded-xl bg-emerald-100 border border-slate-200 shadow-sm transition-all"></button>
                        <button onclick="changeBgColor('#e0f2fe', this)" class="color-swatch h-10 w-10 rounded-xl bg-sky-100 border border-slate-200 shadow-sm transition-all"></button>
                    </div>
                </div>

                <!-- Section 2: Different Textures -->
                <div>
                    <label class="block text-[10px] font-extrabold uppercase tracking-widest text-slate-400 mb-2.5">Add Different Textures</label>
                    <div class="grid grid-cols-2 gap-2.5">
                        <button onclick="changeTexture('', this)" class="texture-btn py-2 px-3 border-2 border-amber-500 bg-amber-50 text-amber-700 rounded-xl text-xs font-bold transition-all">None (Solid)</button>
                        <button onclick="changeTexture('texture-dots', this)" class="texture-btn py-2 px-3 border border-slate-200 bg-white text-slate-700 rounded-xl text-xs font-semibold hover:bg-slate-50 transition-all">Polka Dot</button>
                        <button onclick="changeTexture('texture-lines', this)" class="texture-btn py-2 px-3 border border-slate-200 bg-white text-slate-700 rounded-xl text-xs font-semibold hover:bg-slate-50 transition-all">Horizontal Lines</button>
                        <button onclick="changeTexture('texture-grid', this)" class="texture-btn py-2 px-3 border border-slate-200 bg-white text-slate-700 rounded-xl text-xs font-semibold hover:bg-slate-50 transition-all">Blueprint Grid</button>
                    </div>
                </div>

                <!-- Section 3: Typography Options -->
                <div>
                    <label class="block text-[10px] font-extrabold uppercase tracking-widest text-slate-400 mb-2.5">Typography</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="changeFont('font-default', this)" class="font-btn p-2.5 border-2 border-amber-500 bg-amber-50 text-slate-900 rounded-xl text-left text-xs font-bold transition-all font-default">Default (Sans)</button>
                        <button onclick="changeFont('font-clean', this)" class="font-btn p-2.5 border border-slate-200 bg-white text-slate-700 rounded-xl text-left text-xs font-medium hover:bg-slate-50 transition-all font-clean">Clean (Segoe UI)</button>
                        <button onclick="changeFont('font-classic', this)" class="font-btn p-2.5 border border-slate-200 bg-white text-slate-700 rounded-xl text-left text-xs font-medium hover:bg-slate-50 transition-all font-classic">Classic (Serif)</button>
                        <button onclick="changeFont('font-comic', this)" class="font-btn p-2.5 border border-slate-200 bg-white text-slate-700 rounded-xl text-left text-xs font-medium hover:bg-slate-50 transition-all font-comic">Comic Sans Differents</button>
                    </div>
                </div>

                <!-- Reset Defaults Button -->
                <div class="pt-1">
                    <button onclick="resetDefaults()" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold text-xs transition-colors">Reset Defaults</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const settingsBtn = document.getElementById('settingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const workspace = document.getElementById('workspace');
        const appContainer = document.getElementById('appContainer');
        let isSettingsOpen = false;

        function toggleSettings() {
            isSettingsOpen = !isSettingsOpen;
            if (isSettingsOpen) {
                settingsPanel.classList.remove('translate-y-full', 'opacity-0', 'pointer-events-none');
                settingsPanel.classList.add('translate-y-0', 'opacity-100');
            } else {
                settingsPanel.classList.remove('translate-y-0', 'opacity-100');
                settingsPanel.classList.add('translate-y-full', 'opacity-0', 'pointer-events-none');
            }
        }

        settingsBtn.addEventListener('click', toggleSettings);
        closeSettingsBtn.addEventListener('click', toggleSettings);

        function changeBgColor(color, element) {
            workspace.style.backgroundColor = color;
            document.querySelectorAll('.color-swatch').forEach(btn => {
                btn.classList.remove('border-amber-500', 'ring-4', 'ring-amber-500/20');
                btn.classList.add('border-slate-200');
            });
            element.classList.remove('border-slate-200');
            element.classList.add('border-amber-500', 'ring-4', 'ring-amber-500/20');
        }

        function changeTexture(textureClass, element) {
            workspace.classList.remove('texture-dots', 'texture-lines', 'texture-grid');
            if (textureClass) { workspace.classList.add(textureClass); }
            document.querySelectorAll('.texture-btn').forEach(btn => {
                btn.classList.remove('border-amber-500', 'bg-amber-50', 'text-amber-700', 'font-bold');
                btn.classList.add('border-slate-200', 'bg-white', 'text-slate-700', 'font-semibold');
            });
            element.classList.remove('border-slate-200', 'bg-white', 'text-slate-700', 'font-semibold');
            element.classList.add('border-amber-500', 'bg-amber-50', 'text-amber-700', 'font-bold');
        }

        function changeFont(fontClass, element) {
            appContainer.classList.remove('font-default', 'font-clean', 'font-classic', 'font-comic');
            appContainer.classList.add(fontClass);
            document.querySelectorAll('.font-btn').forEach(btn => {
                btn.classList.remove('border-amber-500', 'bg-amber-50', 'font-bold');
                btn.classList.add('border-slate-200', 'bg-white', 'font-medium');
            });
            element.classList.remove('border-slate-200', 'bg-white', 'font-medium');
            element.classList.add('border-amber-500', 'bg-amber-50', 'font-bold');
        }

        function resetDefaults() {
            const defaultColorSwatch = document.querySelectorAll('.color-swatch')[0];
            changeBgColor('#f8fafc', defaultColorSwatch);
            const defaultTextureBtn = document.querySelectorAll('.texture-btn')[0];
            changeTexture('', defaultTextureBtn);
            const defaultFontBtn = document.querySelectorAll('.font-btn')[0];
            changeFont('font-default', defaultFontBtn);
        }
    </script>
</body>
</html>
