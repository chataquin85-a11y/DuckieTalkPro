name: Build iOS IPA for Firebase

on:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Add and Sync iOS Platform
        run: |
          rm -rf ios || true
          npx cap add ios || true
          npx cap sync ios

      - name: Setup Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build iOS App Archive
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -archivePath $PWD/ios/build/App.xcarchive \
                     archive \
                     CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Export IPA Package
        run: |
          xcodebuild -exportArchive \
                     -archivePath $PWD/ios/build/App.xcarchive \
                     -exportPath $PWD/ios/build/ipa \
                     -exportOptionsPlist ios/App/ExportOptions.plist || true
