<script>
let duckieStatusGuardados=JSON.parse(localStorage.getItem('duckieStatusReales')||'[]');
function duckieGuardarTodo(){localStorage.setItem('duckieStatusReales',JSON.stringify(duckieStatusGuardados));}
function toastReal(m){let t=document.getElementById('toastReal');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.display='none'},2500);}

// ===== CAMARA EN VIVO - FOTO + VIDEO CORTO =====
let streamCamaraVivo=null, trackCamaraVivo=null, camaraFrontalVivo=true, zoomActualVivo=1, lensActualVivo='none', lensNombreVivo='Normal', luzFrontalOn=false;
let modoCamaraVivo='foto', duracionVideoElegida=15, mediaRecorderVivo=null, chunksVideoVivo=[], grabandoVideo=false, timerGrabando=null, segundosGrabados=0;

async function abrirCamaraVivo(){document.getElementById('camaraVivoBox').classList.add('mostrar');await iniciarStreamCamara();}
async function abrirCamaraVivoVideo(){cambiarModoCamara('video');document.getElementById('camaraVivoBox').classList.add('mostrar');await iniciarStreamCamara();}
async function iniciarStreamCamara(){
  try{
    if(streamCamaraVivo) streamCamaraVivo.getTracks().forEach(t=>t.stop());
    streamCamaraVivo=await navigator.mediaDevices.getUserMedia({video:{facingMode:camaraFrontalVivo?'user':'environment',width:{ideal:1280},height:{ideal:720}},audio:true});
    let v=document.getElementById('videoCamaraVivo');v.srcObject=streamCamaraVivo;v.play().catch(()=>{});
    trackCamaraVivo=streamCamaraVivo.getVideoTracks()[0];
    aplicarLensVivo();
  }catch(e){toastReal('⚠️ No se pudo abrir la cámara: '+e.message);}
}
function cerrarCamaraVivo(){
  if(grabandoVideo) detenerGrabacionVideo(true);
  if(streamCamaraVivo) streamCamaraVivo.getTracks().forEach(t=>t.stop());
  streamCamaraVivo=null;trackCamaraVivo=null;
  if(luzFrontalOn) apagarLuzFrontalVisual();
  document.getElementById('camaraVivoBox').classList.remove('mostrar');
}
async function cambiarCamaraVivo(){camaraFrontalVivo=!camaraFrontalVivo;await iniciarStreamCamara();}
function cambiarModoCamara(modo){
  modoCamaraVivo=modo;
  document.getElementById('modoFotoBtn').classList.toggle('activo',modo==='foto');
  document.getElementById('modoVideoBtn').classList.toggle('activo',modo==='video');
  document.getElementById('duracionVideoBox').style.display=modo==='video'?'flex':'none';
  document.getElementById('tituloCamaraVivo').textContent=modo==='video'?'🎥 Grabar Video Corto':'📷 Cámara en vivo';
  document.getElementById('btnCapturarVivo').textContent=modo==='video'?'● Grabar Video Corto':'📸 Tomar Foto';
  document.getElementById('btnCapturarVivo').style.background=modo==='video'?'#c0392b':'#25D366';
  document.getElementById('btnCapturarVivo').style.color='#fff';
  if(modo==='video')document.getElementById('btnCapturarVivo').style.color='#fff';
  if(modo==='foto')document.getElementById('btnCapturarVivo').style.color='#000';
  document.getElementById('ayudaCamaraVivo').textContent=modo==='video'?'🎥 Pica Grabar, habla / baila / saluda - se corta solo a los '+duracionVideoElegida+' seg':'📸 Foto: pica Tomar Foto';
}
function elegirDuracionVideo(seg,btn){
  duracionVideoElegida=seg;
  document.querySelectorAll('.duracion-btn').forEach(b=>b.classList.remove('activo'));
  if(btn)btn.classList.add('activo');
  document.getElementById('ayudaCamaraVivo').textContent='🎥 Video de '+seg+' seg - Pica Grabar';
}
function cambiarZoomVivo(val){
  zoomActualVivo=parseFloat(val);
  document.getElementById('zoomEtiquetaVivo').textContent='🔍 Zoom: '+zoomActualVivo.toFixed(1)+'x';
  let v=document.getElementById('videoCamaraVivo');
  if(trackCamaraVivo){try{let caps=trackCamaraVivo.getCapabilities();if(caps.zoom){trackCamaraVivo.applyConstraints({advanced:[{zoom:zoomActualVivo}]});v.style.transform='scale(1)';return;}}catch(e){}}
  v.style.transform='scale('+zoomActualVivo+')';
}
function cambiarLensVivo(filtro,nombre,btn){
  lensActualVivo=filtro;lensNombreVivo=nombre;
  document.querySelectorAll('.lens-btn').forEach(b=>b.classList.remove('activo'));
  if(btn)btn.classList.add('activo');
  document.getElementById('lensEtiquetaVivo').textContent='👓 Lens: '+nombre;
  aplicarLensVivo();
}
function aplicarLensVivo(){let v=document.getElementById('videoCamaraVivo');if(v)v.style.filter=lensActualVivo;}
async function toggleLuzFrontalVivo(){
  luzFrontalOn=!luzFrontalOn;
  let btn=document.getElementById('btnLuzFrontal');
  if(luzFrontalOn){btn.textContent='🔦 Luz Frontal: ON';btn.style.background='#FFD700';btn.style.color='#000';
    if(trackCamaraVivo){try{await trackCamaraVivo.applyConstraints({advanced:[{torch:true}]});toastReal('🔦 Flash frontal real prendido');return;}catch(e){}}
    document.getElementById('luzFrontalSimulada').style.opacity='0.85';toastReal('🔦 Luz frontal en pantalla ON');
  }else{apagarLuzFrontalVisual();}
}
async function apagarLuzFrontalVisual(){
  luzFrontalOn=false;
  let btn=document.getElementById('btnLuzFrontal');
  if(btn){btn.textContent='🔦 Luz Frontal: OFF';btn.style.background='#333';btn.style.color='#fff';}
  document.getElementById('luzFrontalSimulada').style.opacity='0';
  if(trackCamaraVivo){try{await trackCamaraVivo.applyConstraints({advanced:[{torch:false}]});}catch(e){}}
}
function accionCapturarVivo(){
  if(modoCamaraVivo==='foto'){tomarFotoVivo();}
  else{
    if(!grabandoVideo) iniciarGrabacionVideo();
    else detenerGrabacionVideo(false);
  }
}
function tomarFotoVivo(){
  let v=document.getElementById('videoCamaraVivo');
  if(!v||!v.videoWidth){toastReal('⚠️ Espera a que cargue la cámara');return;}
  let luz=document.getElementById('luzFrontalSimulada');luz.style.opacity='0.9';setTimeout(()=>{if(!luzFrontalOn)luz.style.opacity='0';},150);
  let canvas=document.createElement('canvas');canvas.width=v.videoWidth;canvas.height=v.videoHeight;
  let ctx=canvas.getContext('2d');ctx.filter=lensActualVivo==='none'?'none':lensActualVivo;
  if(camaraFrontalVivo){ctx.translate(canvas.width,0);ctx.scale(-1,1);}
  if(zoomActualVivo>1){let w=v.videoWidth/zoomActualVivo;let h=v.videoHeight/zoomActualVivo;let x=(v.videoWidth-w)/2;let y=(v.videoHeight-h)/2;ctx.drawImage(v,x,y,w,h,0,0,canvas.width,canvas.height);}
  else{ctx.drawImage(v,0,0,canvas.width,canvas.height);}
  let dataUrl=canvas.toDataURL('image/jpeg',0.9);
  cerrarCamaraVivo();
  statusPendiente={id:Date.now(),nombre:'Foto Cámara en vivo - Lens '+lensNombreVivo,tipo:'image/jpeg',datos:dataUrl,fecha:new Date().toLocaleString(),texto:''};
  abrirEditorConStatusPendiente(dataUrl,'image');
  toastReal('📸 Foto tomada con Lens '+lensNombreVivo+' - Ahora edítala');
}
// ===== VIDEO CORTO - GRABAR EN VIVO =====
function iniciarGrabacionVideo(){
  if(!streamCamaraVivo){toastReal('⚠️ Espera a que cargue la cámara');return;}
  chunksVideoVivo=[];segundosGrabados=0;grabandoVideo=true;
  try{mediaRecorderVivo=new MediaRecorder(streamCamaraVivo,{mimeType:'video/webm'});}
  catch(e){mediaRecorderVivo=new MediaRecorder(streamCamaraVivo);}
  mediaRecorderVivo.ondataavailable=function(e){if(e.data.size>0)chunksVideoVivo.push(e.data);};
  mediaRecorderVivo.onstop=function(){terminarVideoCortoGrabado();};
  mediaRecorderVivo.start(200);
  document.getElementById('indicadorGrabando').style.display='block';
  document.getElementById('btnCapturarVivo').textContent='⏹️ Detener y Guardar';
  document.getElementById('btnCapturarVivo').style.background='#333';
  actualizarIndicadorGrabando();
  timerGrabando=setInterval(function(){
    segundosGrabados++;
    actualizarIndicadorGrabando();
    if(segundosGrabados>=duracionVideoElegida){detenerGrabacionVideo(false);}
  },1000);
  toastReal('🎥 Grabando video corto de '+duracionVideoElegida+' seg - Lens '+lensNombreVivo);
}
function actualizarIndicadorGrabando(){
  let m=Math.floor(segundosGrabados/60);let s=segundosGrabados%60;
  let mm=Math.floor(duracionVideoElegida/60);let ss=duracionVideoElegida%60;
  document.getElementById('indicadorGrabando').textContent='● REC '+m+':'+String(s).padStart(2,'0')+' / '+mm+':'+String(ss).padStart(2,'0');
  document.getElementById('barraProgresoVideo').style.width=Math.min(100,(segundosGrabados/duracionVideoElegida)*100)+'%';
}
function detenerGrabacionVideo(cancelar){
  if(!grabandoVideo)return;
  grabandoVideo=false;clearInterval(timerGrabando);
  document.getElementById('indicadorGrabando').style.display='none';
  document.getElementById('barraProgresoVideo').style.width='0%';
  document.getElementById('btnCapturarVivo').textContent='● Grabar Video Corto';
  document.getElementById('btnCapturarVivo').style.background='#c0392b';
  if(mediaRecorderVivo && mediaRecorderVivo.state!=='inactive'){
    if(cancelar){mediaRecorderVivo.onstop=null;}
    mediaRecorderVivo.stop();
  }
  if(cancelar)toastReal('❌ Grabación cancelada');
}
function terminarVideoCortoGrabado(){
  if(!chunksVideoVivo.length)return;
  let blob=new Blob(chunksVideoVivo,{type:'video/webm'});
  let r=new FileReader();
  r.onload=function(ev){
    cerrarCamaraVivo();
    statusPendiente={id:Date.now(),nombre:'Video Corto '+duracionVideoElegida+'s - Lens '+lensNombreVivo,tipo:'video/webm',datos:ev.target.result,fecha:new Date().toLocaleString(),texto:''};
    abrirEditorConStatusPendiente(ev.target.result,'video');
    toastReal('🎥 Video corto de '+duracionVideoElegida+' seg listo - Ahora edítalo y publícalo');
  };
  r.readAsDataURL(blob);
}
function abrirEditorConStatusPendiente(dataUrl,tipo){
  filtroStatusActual=lensActualVivo;
  musicaStatusElegida=null;musicaSeleccionadaNombre='Sin música';
  document.getElementById('editorStatusTexto').value='';
  document.getElementById('editorStatusTextoOverlay').textContent='';
  document.getElementById('musicaElegidaTexto').textContent='Sin música';
  let img=document.getElementById('editorStatusImg');let vid=document.getElementById('editorStatusVideo');
  img.style.display='none';vid.style.display='none';vid.pause();
  if(tipo==='image'){img.style.display='block';img.src=dataUrl;img.style.filter=lensActualVivo;}
  else{vid.style.display='block';vid.src=dataUrl;vid.style.filter=lensActualVivo;}
  document.getElementById('editorStatusBox').style.display='flex';
}

// ===== STATUS NORMAL =====
let statusPendiente=null,filtroStatusActual='none',musicaStatusElegida=null,musicaSeleccionadaNombre='Sin música',statusActualId=null,statusAnilloTimer=null;
let bibliotecaMusica=[{nombre:'Alegre - Mañana Feliz',categoria:'alegre fiesta',url:''},{nombre:'Suave - Atardecer',categoria:'suave romantico',url:''},{nombre:'Fiesta - Baila',categoria:'fiesta alegre',url:''},{nombre:'Romántico - Corazón',categoria:'romantico suave',url:''},{nombre:'Duckie - Quack Quack',categoria:'duckie divertido',url:''},{nombre:'Tranquilo - Noche',categoria:'suave tranquilo',url:''},{nombre:'Energía - Gym',categoria:'fiesta energia',url:''}];
function htmlStatusAnillo(){
  let lista=duckieStatusGuardados||[];
  let otros=lista.map(function(s){let foto=(s.datos&&s.tipo&&s.tipo.indexOf('image')!==-1)?s.datos:'./IMG_4685.png';let txtMini=s.texto?'<div style="font-size:10px;color:#fff;background:rgba(0,0,0,.6);border-radius:8px;padding:2px 4px;margin-top:2px">'+s.texto.substring(0,18)+'</div>':'';let musMini=s.musicaNombre?'<div style="font-size:9px;color:#FFD700">🎵 '+s.musicaNombre.substring(0,14)+'</div>':'';let videoMini=(s.tipo&&s.tipo.indexOf('video')!==-1)?'<div style="font-size:9px;color:#fff;background:#c0392b;border-radius:8px;padding:1px 4px;margin-top:2px">🎥 Video Corto</div>':'';return '<div class="story-circle" onclick="verStatusAnillo(\''+s.id+'\')"><div class="story-ring"><img src="'+foto+'"></div><div class="story-name">Mi Status</div><div class="story-time">'+(s.fecha||'')+'</div>'+txtMini+videoMini+musMini+'</div>';}).join('');
  let cards=lista.map(function(s){if(s.tipo&&s.tipo.indexOf('image')!==-1)return '<div class="add-status-card" onclick="verStatusAnillo(\''+s.id+'\')"><img class="bg" src="'+s.datos+'" style="filter:'+(s.filtro||'none')+'"><span class="add-label">'+(s.texto||s.nombre||'Status')+'</span></div>';if(s.tipo&&s.tipo.indexOf('video')!==-1)return '<div class="add-status-card" onclick="verStatusAnillo(\''+s.id+'\')"><video class="bg" src="'+s.datos+'"></video><span class="add-label">🎥 '+(s.texto||s.nombre||'Video Corto')+'</span></div>';return '<div class="add-status-card" onclick="verStatusAnillo(\''+s.id+'\')"><div class="bg" style="background:#25D366;display:flex;align-items:center;justify-content:center;font-size:30px">💬</div><span class="add-label">'+(s.texto||s.nombre||'Status')+'</span></div>';}).join('');
  return '<div class="status-anillo-row"><div class="story-circle" onclick="abrirCamaraVivo()"><div class="story-ring mio"><img src="./IMG_4685.png"><span class="story-plus">+</span></div><div class="story-name">Your Story</div><div class="story-time">Add status</div></div>'+otros+'</div><div class="status-add-cards"><div class="add-status-card" onclick="abrirCamaraVivo()"><img class="bg" src="./IMG_4685.png"><span class="add-plus">+</span><span class="add-label">📷 Cámara en vivo</span></div><div class="add-status-card" onclick="abrirCamaraVivoVideo()" style="background:#c0392b"><div class="bg" style="background:#c0392b;display:flex;align-items:center;justify-content:center;font-size:40px">🎥</div><span class="add-label">🎥 Grabar Video Corto</span></div>'+cards+'</div>';
}
function pintarStatusAnilloEnPantalla(){let h=document.getElementById('holderStatusAnillo');if(h)h.innerHTML=htmlStatusAnillo();}
function subirStatusAnillo(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(ev){statusPendiente={id:Date.now(),nombre:f.name,tipo:f.type,datos:ev.target.result,fecha:new Date().toLocaleString(),texto:''};filtroStatusActual='none';musicaStatusElegida=null;musicaSeleccionadaNombre='Sin música';document.getElementById('editorStatusTexto').value='';document.getElementById('editorStatusTextoOverlay').textContent='';document.getElementById('musicaElegidaTexto').textContent='Sin música';let img=document.getElementById('editorStatusImg');let vid=document.getElementById('editorStatusVideo');img.style.display='none';vid.style.display='none';vid.pause();if(f.type.indexOf('image')!==-1){img.style.display='block';img.src=ev.target.result;img.style.filter='none';}else if(f.type.indexOf('video')!==-1){vid.style.display='block';vid.src=ev.target.result;vid.style.filter='none';}document.getElementById('editorStatusBox').style.display='flex';};r.readAsDataURL(f);e.target.value='';}
function aplicarFiltroStatus(f){filtroStatusActual=f;let img=document.getElementById('editorStatusImg');let vid=document.getElementById('editorStatusVideo');if(img)img.style.filter=f;if(vid)vid.style.filter=f;}
function cerrarEditorStatus(){document.getElementById('editorStatusBox').style.display='none';statusPendiente=null;}
function publicarStatusEditado(){if(!statusPendiente)return;statusPendiente.texto=document.getElementById('editorStatusTexto').value||'';statusPendiente.filtro=filtroStatusActual;statusPendiente.musica=musicaSeleccionadaNombre||'Sin música';if(musicaStatusElegida){statusPendiente.musicaDatos=musicaStatusElegida.datos;statusPendiente.musicaNombre=musicaStatusElegida.nombre;}duckieStatusGuardados.unshift(statusPendiente);duckieGuardarTodo();document.getElementById('editorStatusBox').style.display='none';pintarStatusAnilloEnPantalla();verStatusAnillo(statusPendiente.id);musicaStatusElegida=null;musicaSeleccionadaNombre='Sin música';statusPendiente=null;toastReal('✅ Status publicado');}
function publicarStatusTextoReal(){let texto=document.getElementById('inputStatusTextoReal')?.value.trim();if(!texto){toastReal('⚠️ Escribe algo primero');return;}let n={id:Date.now(),nombre:'Status Texto',tipo:'text',datos:'',fecha:new Date().toLocaleString(),texto:texto,filtro:'none'};if(musicaStatusElegida){n.musicaDatos=musicaStatusElegida.datos;n.musicaNombre=musicaStatusElegida.nombre;}duckieStatusGuardados.unshift(n);duckieGuardarTodo();pintarStatusAnilloEnPantalla();document.getElementById('inputStatusTextoReal').value='';document.getElementById('boxStatusTextoReal').style.display='none';verStatusAnillo(n.id);toastReal('✅ Status de texto publicado');}
function abrirSelectorMusica(){document.getElementById('selectorMusicaBox').style.display='flex';pintarMusicaUsuario('');}
function cerrarSelectorMusica(){document.getElementById('selectorMusicaBox').style.display='none';}
function pintarMusicaUsuario(q){q=(q||'').toLowerCase();let box=document.getElementById('listaMusicaUsuario');let lista=bibliotecaMusica.filter(m=>(m.nombre+' '+m.categoria).toLowerCase().includes(q));if(!lista.length){box.innerHTML='<div style="color:#fff;text-align:center;padding:20px">No encontré esa música.<br>Sube tu propio MP3 arriba 👆</div>';return;}box.innerHTML=lista.map((m)=>'<div style="background:#0e2e1f;border:1px solid #2a6040;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center"><div><b style="color:#fff">'+m.nombre+'</b><br><small style="color:#a3c9a8">'+m.categoria+'</small></div><button onclick="elegirMusicaUsuario('+bibliotecaMusica.indexOf(m)+')" style="background:#25D366;color:#000;border:none;padding:8px 14px;border-radius:999px;font-weight:800">Usar</button></div>').join('');}
function filtrarMusicaUsuario(){pintarMusicaUsuario(document.getElementById('buscarMusicaInput').value);}
function elegirMusicaUsuario(idx){let m=bibliotecaMusica[idx];musicaStatusElegida={nombre:m.nombre,datos:m.url};musicaSeleccionadaNombre=m.nombre;document.getElementById('musicaElegidaTexto').textContent='🎵 Música elegida: '+m.nombre;cerrarSelectorMusica();toastReal('🎵 Música: '+m.nombre);}
function subirMusicaStatus(e){let f=e.target.files[0];if(!f)return;if(f.size>8*1024*1024){toastReal('⚠️ Usa un corto de 15-30 seg, menos de 8MB');return;}let r=new FileReader();r.onload=function(ev){musicaStatusElegida={nombre:f.name,datos:ev.target.result};musicaSeleccionadaNombre=f.name;document.getElementById('musicaElegidaTexto').textContent='🎵 Tu música: '+f.name;cerrarSelectorMusica();toastReal('🎵 Tu música: '+f.name);};r.readAsDataURL(f);e.target.value='';}
function verStatusAnillo(id){let s=(duckieStatusGuardados||[]).find(x=>String(x.id)===String(id));if(!s)return;statusActualId=id;let img=document.getElementById('visorAnilloImg');let vid=document.getElementById('visorAnilloVideo');let txt=document.getElementById('visorAnilloTexto');let mus=document.getElementById('visorAnilloMusica');document.getElementById('visorAnilloNombre').textContent='Your Story - '+(s.fecha||'');img.style.display='none';vid.style.display='none';txt.style.display='none';mus.style.display='none';vid.pause();img.style.filter=s.filtro||'none';if(s.tipo&&s.tipo.indexOf('image')!==-1){img.style.display='block';img.src=s.datos;}else if(s.tipo&&s.tipo.indexOf('video')!==-1){vid.style.display='block';vid.src=s.datos;vid.play().catch(()=>{});}if(s.texto){txt.style.display='block';txt.textContent=s.texto;}if(s.musicaNombre){mus.style.display='block';mus.textContent='🎵 '+s.musicaNombre;}document.getElementById('visorAnillo').classList.add('mostrar');let barra=document.getElementById('barraAnillo');barra.style.width='0%';clearInterval(statusAnilloTimer);let p=0;statusAnilloTimer=setInterval(function(){p+=1;barra.style.width=p+'%';if(p>=100){clearInterval(statusAnilloTimer);cerrarVisorAnillo();}},150);}
function cerrarVisorAnillo(){clearInterval(statusAnilloTimer);document.getElementById('visorAnillo').classList.remove('mostrar');document.getElementById('visorAnilloVideo').pause();}
function borrarStatusActual(){if(!statusActualId)return;duckieStatusGuardados=duckieStatusGuardados.filter(s=>String(s.id)!==String(statusActualId));duckieGuardarTodo();cerrarVisorAnillo();pintarStatusAnilloEnPantalla();toastReal('🗑️ Status borrado');}
function saltarVista(vista){
  document.querySelectorAll('.top-tabs button').forEach(b=>b.classList.remove('activo'));
  let mapa={todos:'tab-todos',texto:'tab-texto'};
  if(mapa[vista])document.getElementById(mapa[vista])?.classList.add('activo');
  let box=document.getElementById('chatBox');if(!box)return;
  if(vista==='todos'){box.innerHTML='<div style="padding:4px"><h3>📊 Status ('+duckieStatusGuardados.length+')</h3><div id="holderStatusAnillo"></div><div id="boxStatusTextoReal" class="contact-card" style="display:none"><b>✍️ Escribe tu Status de texto</b><input id="inputStatusTextoReal" class="duckie-search-input" placeholder="Escribe aquí tu Status..."><button class="perm-btn" style="width:100%;padding:12px" onclick="publicarStatusTextoReal()">✅ Publicar Status de texto</button></div><div class="contact-card"><b>📸 Subir Status</b><small>Foto / Video Corto / Música / Texto - con editor antes de publicar</small><button class="perm-btn" style="width:100%;padding:12px;margin-top:8px" onclick="abrirCamaraVivo()">📷 Cámara en vivo - Foto + Zoom + Luz + Lens</button><button class="perm-btn red" style="width:100%;padding:12px;margin-top:8px" onclick="abrirCamaraVivoVideo()">🎥 Grabar Video Corto - 15 / 30 / 60 seg</button><button class="perm-btn" style="width:100%;padding:12px;margin-top:8px" onclick="document.getElementById(\'statusFileAdd\').click()">🖼️ Subir foto / video de galería</button><button class="perm-btn yellow" style="width:100%;padding:12px;margin-top:8px" onclick="saltarVista(\'texto\')">✍️ Escribir Texto</button><button class="perm-btn" style="width:100%;padding:12px;margin-top:8px" onclick="abrirSelectorMusica()">🎵 Escoger Música</button></div><button class="perm-btn gray" style="width:100%;padding:12px" onclick="window.location.href=\'index.html\'">🏠 Home</button></div>';pintarStatusAnilloEnPantalla();}
  if(vista==='texto'){box.innerHTML='<div style="padding:4px"><h3>✍️ Status de Texto</h3><div id="holderStatusAnillo"></div><div class="contact-card"><b>✍️ Escribe tu Status</b><input id="inputStatusTextoReal" class="duckie-search-input" placeholder="Escribe aquí tu Status..."><button class="perm-btn" style="width:100%;padding:12px" onclick="publicarStatusTextoReal()">✅ Publicar Status de texto</button><button class="perm-btn" style="width:100%;padding:12px;margin-top:8px" onclick="abrirSelectorMusica()">🎵 Escoger Música para este Status</button></div><button class="perm-btn gray" style="width:100%;padding:12px" onclick="window.location.href=\'index.html\'">🏠 Home</button></div>';pintarStatusAnilloEnPantalla();}
}
saltarVista('todos');
</script>
