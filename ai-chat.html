<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat - Duckie Guai-fai'v</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
--bg-color: #121c14;
--panel-color: #1b2e20;
--accent-color: #2e6f40;
--accent-hover: #3b8c51;
--text-main: #ffffff;
--text-muted: #a3c1ad;
--chat-bg-outgoing: #2e6f40;
--chat-text-outgoing: #ffffff;
--chat-bg-incoming: #1b2e20;
--chat-text-incoming: #ffffff;
}
* {box-sizing: border-box;margin: 0;padding: 0;font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;}
body {background-color: var(--bg-color);color: var(--text-main);height: 100vh;display: flex;flex-direction: column;overflow: hidden;}
header {display: flex;justify-content: space-between;align-items: center;background-color: var(--panel-color);padding: 10px 16px;border-bottom: 1px solid #284a32;}
.icon-btn {background: none;border: none;color: var(--text-main);font-size: 1.2rem;cursor: pointer;}
.app-title {font-size: 1.05rem;font-weight: 600;}
.chat-header-profile {display: flex;flex-direction: column;align-items: center;padding: 18px;gap: 8px;border-bottom: 1px solid rgba(40, 74, 50, 0.3);}
.avatar-container {width: 64px;height: 64px;border-radius: 50%;background-color: var(--accent-color);display: flex;justify-content: center;align-items: center;overflow: hidden;border: 2px solid #4e9a63;}
.avatar-container img {width: 100%;height: 100%;object-fit: cover;}
.assistant-name {font-weight: 700;font-size: 1.05rem;}
.assistant-subtitle {font-size: 0.8rem;color: var(--text-muted);}
.messages-list {flex: 1;overflow-y: auto;padding: 18px;display: flex;flex-direction: column;gap: 14px;}
.message-bubble {max-width: 78%;padding: 12px 16px;border-radius: 14px;font-size: 0.95rem;line-height: 1.45;position: relative;white-space: pre-wrap;}
.message-bubble.incoming {background-color: var(--chat-bg-incoming);color: var(--chat-text-incoming);align-self: flex-start;border: 1px solid #284a32;}
.message-bubble.outgoing {background-color: var(--chat-bg-outgoing);color: var(--chat-text-outgoing);align-self: flex-end;}
.chat-input-area {display: flex;align-items: center;background-color: var(--panel-color);padding: 10px 14px;gap: 10px;border-top: 1px solid #284a32;}
.chat-input-wrapper {flex: 1;display: flex;align-items: center;background-color: var(--bg-color);border-radius: 24px;padding: 8px 14px;border: 1px solid #284a32;}
.chat-input-wrapper input {flex: 1;background: transparent;border: none;color: var(--text-main);font-size: 15px;outline: none;}
.media-actions-right {display: flex;align-items: center;gap: 8px;}
.btn-icon-right {background: transparent;border: none;color: var(--text-muted);cursor: pointer;font-size: 18px;}
.send-btn-ios {background-color: var(--accent-color);border: none;color: #fff;width: 38px;height: 38px;border-radius: 50%;cursor: pointer;display: flex;align-items: center;justify-content: center;}
.bottom-nav {display: flex;justify-content: space-around;align-items: center;background-color: var(--panel-color);border-top: 1px solid #284a32;padding: 6px 5px;height: 60px;}
.nav-item {background: none;border: none;color: var(--text-muted);cursor: pointer;display: flex;flex-direction: column;align-items: center;gap: 3px;font-size: 0.72rem;flex: 1;}
.nav-item span.icon {font-size: 1.15rem;}
.nav-item.active {color: #ffd700;}
#betaBanner{background:linear-gradient(90deg,#ffc300 0%,#ff8c00 100%);color:#000;padding:8px 12px;text-align:center;font-weight:900;font-size:11px;display:flex;justify-content:center;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<header>
<div style="display:flex;align-items:center;gap:12px">
<button class="icon-btn" onclick="location.href='index.html'" title="Volver">←</button>
<span class="app-title">Duckie Guai-fai'v • AI Chat</span>
</div>
<div style="display:flex;align-items:center;gap:14px">
<button class="icon-btn" onclick="location.href='marketplace.html'" title="Marketplace">🛒</button>
<button class="icon-btn" onclick="location.href='index.html'" title="Home">⚙</button>
</div>
</header>

<div id="betaBanner">
<span>🦆 BETA FUNDADORES</span>
<span id="countdownBeta" style="background:#000;color:#ffc300;padding:3px 8px;border-radius:12px">30 días - 0% COMISIÓN</span>
<span>DuckieTheMus.com</span>
</div>

<div class="chat-header-profile">
<div class="avatar-container">
<img src="IMG_5468.png" alt="Duckie" onerror="this.style.display='none';this.parentElement.textContent='🦆'">
</div>
<div class="assistant-name">Duckie Guai-fai'v</div>
<div class="assistant-subtitle">Unified AI Assistant Stack (Streaming Real / Local)</div>
</div>

<div class="messages-list" id="messagesList"></div>

<div class="chat-input-area">
<div class="chat-input-wrapper">
<input type="text" id="chatInput" placeholder="Ask Duckie Guai-fai'v..." onkeypress="handleKeyPress(event)">
</div>
<div class="media-actions-right">
<button class="btn-icon-right" onclick="triggerInstantVoice()" title="Voz"><i class="fa-solid fa-microphone"></i></button>
<button class="send-btn-ios" onclick="sendUserMessage()" title="Enviar"><i class="fa-solid fa-paper-plane"></i></button>
</div>
</div>

<nav class="bottom-nav">
<button class="nav-item" onclick="location.href='index.html'"><span class="icon">👥</span><span>Contactos</span></button>
<button class="nav-item" onclick="location.href='index.html'"><span class="icon">📞</span><span>Llamadas</span></button>
<button class="nav-item active"><span class="icon">🦆</span><span>AI Chat</span></button>
<button class="nav-item" onclick="location.href='index.html'"><span class="icon">💬</span><span>Chats</span></button>
<button class="nav-item" onclick="location.href='marketplace.html'"><span class="icon">🛍️</span><span>Tienda</span></button>
</nav>

<script>
// === CODIGO COMPLETO DE TU INDEX ORIGINAL - PRESERVADO SIN BORRAR ===
const betaEnd = new Date(); betaEnd.setDate(betaEnd.getDate()+30);
function updateBeta(){
  const diff = betaEnd - new Date();
  const d = Math.floor(diff/(1000*60*60*24));
  const el = document.getElementById('countdownBeta');
  if(el) el.textContent = d+' días - 0% COMISIÓN';
}
updateBeta(); setInterval(updateBeta, 3600000*6);

// --- BACKEND REAL + STREAMING INYECTADO ---
async function askGuaiFai(text, onChunk) {
    const backendUrl = "https://duckietalkpro.onrender.com/api/chat";
    const response = await fetch(backendUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            messages: [
                { role: "system", content: "Eres Duckie Guai-fai'v 🧠. El fiel asistente de Amado Apolonio Simom. Responde directo, empático, con tono norteño y servicial." },
                { role: "user", content: text }
            ]
        })
    });
    if (!response.ok) throw new Error("Error backend Render");
    const data = await response.json();
    const replyText = data.reply || data.choices?.[0]?.message?.content || "Respuesta recibida.";
    if (onChunk) onChunk(replyText);
    return replyText;
}

let chatMessagesHistory = JSON.parse(localStorage.getItem('duckie_chat_history')) || [
{ role: "system", content: "You are Duckie Guai-fai'v, attached to DuckieTalkPro." },
{ role: "assistant", content: "¡Hola Amado! Soy Duckie Guai-fai'v 🧠, ¿Qué desarrollamos, ajustamos o sincronizamos el día de hoy?" }
];

function saveData(){ localStorage.setItem('duckie_chat_history', JSON.stringify(chatMessagesHistory)); }

function appendMessageBubble(text, type, containerId){
  const list = document.getElementById(containerId || 'messagesList');
  if(!list) return;
  const bubble = document.createElement('div');
  bubble.className = `message-bubble ${type}`;
  bubble.textContent = text;
  list.appendChild(bubble);
  list.scrollTop = list.scrollHeight;
  return bubble;
}

function renderChatHistoryOnLoad(){
  const list = document.getElementById('messagesList');
  if(!list) return;
  list.innerHTML = '';
  chatMessagesHistory.forEach(msg=>{
    if(msg.role==='system') return;
    const type = msg.role==='user'? 'outgoing' : 'incoming';
    appendMessageBubble(msg.content, type);
  });
}

async function sendUserMessageToAI(userText){
  chatMessagesHistory.push({ role: "user", content: userText });
  saveData();
  appendMessageBubble(userText, 'outgoing');
  const list = document.getElementById('messagesList');
  const bubble = document.createElement('div');
  bubble.className = 'message-bubble incoming';
  bubble.textContent = '🧠 Pensando...';
  list.appendChild(bubble);
  list.scrollTop = list.scrollHeight;
  try{
    let finalText = '';
    await askGuaiFai(userText, (chunk)=>{
      finalText = chunk;
      bubble.textContent = chunk;
      list.scrollTop = list.scrollHeight;
    });
    chatMessagesHistory.push({ role: "assistant", content: bubble.textContent });
    saveData();
  }catch(e){
    bubble.textContent = '¡Quack! Error al conectar con el cerebro neuronal en Render. Revisa backend.';
  }
}

function sendUserMessage(){
  const input = document.getElementById('chatInput');
  const txt = input.value.trim();
  if(!txt) return;
  input.value = '';
  sendUserMessageToAI(txt);
}
function handleKeyPress(e){ if(e.key==='Enter') sendUserMessage(); }
function triggerInstantVoice(){ alert('🎙 Grabando voz con Duckie Guai-fai\'v... (Próximamente STT)'); }

document.addEventListener('DOMContentLoaded', ()=>{ renderChatHistoryOnLoad(); });
</script>
</body>
</html>
